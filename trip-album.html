<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>YashYash | 旅行相簿</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/album.css">
    <link rel="stylesheet" href="css/product.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="auth-pending trip-album-page">
    <header class="app-header">
        <button id="back-to-details" class="btn-small">← 行程</button>
        <h2 style="margin:0;">旅行相簿</h2>
        <!-- 新增打包下載按鈕 -->
        <button onclick="downloadAllPhotos()" class="btn-small" aria-label="下載全部旅行照片">📦 全部下載</button>
    </header>

    <main class="album-container">
        <p class="empty-text" style="margin:12px 0 0;">可拖曳照片排序或移動到其他日期</p>
        <div id="upload-status" class="upload-status hidden" role="status" aria-live="polite"></div>
        <div id="days-album-wrapper">
            <p class="empty-text">載入回憶中...</p>
        </div>
    </main>

    <!-- 批量上傳用的隱藏 input (注意新增了 multiple) -->
    <input type="file" id="photo-input" hidden multiple accept="image/*" onchange="handleFileUpload(event)">

    <!-- 全螢幕預覽層 (Lightbox) -->
    <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-info" onclick="event.stopPropagation()">
            <span id="lightbox-text"></span>
            <br> <!-- 換行讓按鈕在下面 -->
            <button id="btn-delete-photo" class="btn-danger-small">刪除照片</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/trip-nav.js"></script>
    <script src="js/photo-utils.js"></script>
    <script src="js/trip-album.js"></script>
</body>
</html>
