<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YashYash | 行程規劃</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body class="details-page auth-pending" data-planner-view="itinerary">
    <header class="app-header">
        <div class="header-left">
            <button onclick="location.href='index.html'" class="btn-small">← 返回</button>
        </div>
        <div id="trip-title" class="trip-title">
            <span id="trip-title-text" class="trip-title-text">載入中...</span>
            <div id="trip-participants" class="trip-participants" aria-label="參與夥伴"></div>
        </div>
        
        <div class="actions">
            <button id="edit-date-btn" onclick="editTripDates()" class="btn-small hidden" aria-label="編輯旅行日期" title="編輯日期">📅</button>
            <button id="delete-trip-btn" onclick="deleteTrip()" class="btn-small hidden" aria-label="刪除旅行" title="刪除旅行">🗑️</button>
        </div>
    </header>

    <div class="planner-view-switch" role="group" aria-label="行程顯示方式">
        <button type="button" data-planner-mode="itinerary" aria-pressed="true">行程</button>
        <button type="button" data-planner-mode="map" aria-pressed="false">地圖</button>
    </div>
    <div class="trip-layout">
        <!-- 地圖區域 -->
        <main class="map-view">
            <div id="map"></div>
        </main>

        <!-- 行程側邊欄 -->
        <aside class="itinerary-sidebar">
            <div class="planner-tools">
                <div class="search-box-container">
                    <div class="planner-search-heading">
                        <p class="planner-search-label">規劃下一站</p>
                        <button id="itinerary-transfer-open" class="planner-transfer-open hidden" type="button">匯入 / 匯出</button>
                    </div>
                    <div id="pac-input" aria-label="搜尋景點、餐廳或住宿"></div>
                </div>
                <div id="day-selector" class="day-selector" role="group" aria-label="選擇行程日期"></div>
            </div>
            <div id="days-container">
                <!-- 由 JS 渲染 -->
            </div>
        </aside>
    </div>

    <dialog id="itinerary-transfer-dialog" class="itinerary-transfer-dialog" aria-labelledby="itinerary-transfer-title">
        <div class="transfer-header">
            <div><p class="section-eyebrow">行程資料</p><h2 id="itinerary-transfer-title">匯入 / 匯出</h2></div>
            <button id="itinerary-transfer-close" type="button" aria-label="關閉匯入匯出視窗" title="關閉">×</button>
        </div>
        <p class="transfer-intro">使用標準 XLSX 範本規劃旅程。匯入前可以逐列預覽，確認後才會更新行程。</p>
        <div class="transfer-actions">
            <button id="itinerary-template-download" type="button">下載 AI / Excel 範本</button>
            <button id="itinerary-export-download" type="button">匯出目前行程</button>
            <button id="itinerary-prompt-copy" type="button">複製 AI 提示詞</button>
        </div>
        <label class="transfer-file-label" for="itinerary-import-file">匯入行程 (.xlsx，最多 2 MB)</label>
        <input id="itinerary-import-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <p id="itinerary-transfer-status" class="transfer-status" role="status" aria-live="polite"></p>
        <section id="itinerary-preview" class="itinerary-preview hidden" aria-label="匯入預覽">
            <h3>匯入預覽</h3>
            <p id="itinerary-preview-summary"></p>
            <div id="itinerary-preview-rows" class="transfer-rows"></div>
            <fieldset class="transfer-mode">
                <legend>匯入方式</legend>
                <label><input type="radio" name="itinerary-import-mode" value="merge" checked> 合併：保留原有地點，依順序追加</label>
                <label><input type="radio" name="itinerary-import-mode" value="replace"> 取代：移除原有地點後匯入</label>
            </fieldset>
            <button id="itinerary-backup-download" class="transfer-backup" type="button">先匯出目前行程備份</button>
            <label class="transfer-ack"><input id="itinerary-warning-ack" type="checkbox"> 我已檢查匯入預覽與警告</label>
            <button id="itinerary-import-confirm" class="btn-primary" type="button" disabled>確認匯入</button>
        </section>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/maps-loader.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/trip-nav.js"></script>
    <script src="js/trip-order.js"></script>
    <script src="js/trip-details.js"></script>
    <script src="js/itinerary-import.js"></script>
    
</body>
</html>
