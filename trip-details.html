<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YashYash | 行程規劃</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 確保頁面不產生多餘捲軸 */
        body.details-page { 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }
        
        .trip-layout {
            display: flex;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }
        
        /* 手機版：地圖在上，行程在下 */
        @media (max-width: 768px) {
            .trip-layout {
                flex-direction: column;
            }
            
            .map-view {
                width: 100%;
                height: 45%;
                flex: none;
                order: 1;
            }
            
            .itinerary-sidebar {
                width: 100%;
                height: 55%;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                border-top: 2px solid #e0ddd7;
                order: 2;
                background: #fdfcf9;
            }
            
            /* 手機版按鈕縮小 */
            .actions {
                gap: 4px;
            }
            
            .actions .btn-small {
                font-size: 0.7rem;
                padding: 5px 8px;
                min-height: 36px;
            }
        }
        
        /* 電腦版：左右分欄 */
        @media (min-width: 769px) {
            .trip-layout {
                flex-direction: row;
            }
            
            .itinerary-sidebar {
                width: 420px;
                min-width: 420px;
                border-right: 1px solid #e0ddd7;
                overflow-y: auto;
                background: #fdfcf9;
            }
            
            .map-view {
                flex: 1;
            }
        }
        
        #map {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 搜尋框 */
        .search-box-container {
            padding: 12px;
            background: white;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        #pac-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0ddd7;
            border-radius: 25px;
            font-size: 15px;
            margin: 0;
        }

        #pac-input gmp-place-autocomplete {
            display: block;
            width: 100%;
        }
        
        /* 行程列表容器 */
        #days-container {
            padding: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
    <link rel="stylesheet" href="css/product.css">
</head>
<body class="details-page auth-pending">
    <header class="app-header">
        <div class="header-left">
            <button onclick="location.href='index.html'" class="btn-small">← 返回</button>
        </div>
        <div id="trip-title" class="trip-title">
            <span id="trip-title-text" class="trip-title-text">載入中...</span>
            <div id="trip-participants" class="trip-participants" aria-label="參與夥伴"></div>
        </div>
        
        <div class="actions planner-header-actions">
            <button id="edit-date-btn" onclick="editTripDates()" class="btn-small hidden" aria-label="編輯旅行日期" title="編輯日期">日期</button>
            <button id="delete-trip-btn" onclick="deleteTrip()" class="btn-small hidden planner-delete-trip" aria-label="刪除旅行" title="刪除旅行">刪除</button>
        </div>
    </header>

    <div class="trip-layout">
        <!-- 地圖區域 -->
        <main class="map-view">
            <div id="map"></div>
        </main>

        <!-- 行程側邊欄 -->
        <aside class="itinerary-sidebar" aria-label="行程安排">
            <div class="search-box-container">
                <div class="planner-search-head">
                    <div>
                        <span class="section-eyebrow">PLANNER</span>
                        <strong>安排今天</strong>
                    </div>
                    <span id="active-day-summary" class="status-badge">Day 1</span>
                </div>
                <div id="pac-input" aria-label="搜尋地點"></div>
                <p class="planner-search-hint">搜尋景點後，可直接加入目前選擇的日期。</p>
            </div>
            <div id="day-switcher" class="planner-day-switcher" role="tablist" aria-label="選擇行程日期"></div>
            <div id="days-container" class="planner-days-scroll">
                <!-- 由 JS 渲染 -->
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/maps-loader.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/trip-nav.js"></script>
    <script src="js/trip-details.js"></script>
</body>
</html>
