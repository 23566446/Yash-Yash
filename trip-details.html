<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YashYash | 行程規劃</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body class="details-page auth-pending" data-planner-view="itinerary">
    <header class="app-header">
        <div class="header-left">
            <button onclick="location.href='index.html'" class="btn-small">← 返回</button>
        </div>
        <div id="trip-title" class="trip-title">
            <span id="trip-title-text" class="trip-title-text">載入中...</span>
            <div id="trip-participants" class="trip-participants" aria-label="參與夥伴"></div>
        </div>
        
        <div class="actions">
            <button id="edit-date-btn" onclick="editTripDates()" class="btn-small hidden" aria-label="編輯旅行日期" title="編輯日期">📅</button>
            <button id="delete-trip-btn" onclick="deleteTrip()" class="btn-small hidden" aria-label="刪除旅行" title="刪除旅行">🗑️</button>
        </div>
    </header>

    <div class="planner-view-switch" role="group" aria-label="行程顯示方式">
        <button type="button" data-planner-mode="itinerary" aria-pressed="true">行程</button>
        <button type="button" data-planner-mode="map" aria-pressed="false">地圖</button>
    </div>
    <div class="trip-layout">
        <!-- 地圖區域 -->
        <main class="map-view">
            <div id="map"></div>
        </main>

        <!-- 行程側邊欄 -->
        <aside class="itinerary-sidebar">
            <div class="planner-tools">
                <div class="search-box-container">
                    <p class="planner-search-label">規劃下一站</p>
                    <div id="pac-input" aria-label="搜尋景點、餐廳或住宿"></div>
                </div>
                <div id="day-selector" class="day-selector" role="group" aria-label="選擇行程日期"></div>
            </div>
            <div id="days-container">
                <!-- 由 JS 渲染 -->
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/maps-loader.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/trip-nav.js"></script>
    <script src="js/trip-order.js"></script>
    <script src="js/trip-details.js"></script>
    
</body>
</html>
