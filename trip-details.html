<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YashYash | 行程規劃</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 確保頁面不產生多餘捲軸 */
        body.details-page { 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }
        
        .trip-layout {
            display: flex;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }
        
        /* 手機版：地圖在上，行程在下 */
        @media (max-width: 768px) {
            .trip-layout {
                flex-direction: column;
            }
            
            .map-view {
                width: 100%;
                height: 45%;
                flex: none;
                order: 1;
            }
            
            .itinerary-sidebar {
                width: 100%;
                height: 55%;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                border-top: 2px solid #e0ddd7;
                order: 2;
                background: #fdfcf9;
            }
            
            /* 手機版按鈕縮小 */
            .actions {
                gap: 4px;
            }
            
            .actions .btn-small {
                font-size: 0.7rem;
                padding: 5px 8px;
                min-height: 36px;
            }
        }
        
        /* 電腦版：左右分欄 */
        @media (min-width: 769px) {
            .trip-layout {
                flex-direction: row;
            }
            
            .itinerary-sidebar {
                width: 420px;
                min-width: 420px;
                border-right: 1px solid #e0ddd7;
                overflow-y: auto;
                background: #fdfcf9;
            }
            
            .map-view {
                flex: 1;
            }
        }
        
        #map {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 搜尋框 */
        .search-box-container {
            padding: 12px;
            background: white;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        #pac-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0ddd7;
            border-radius: 25px;
            font-size: 15px;
            margin: 0;
        }
        
        /* 行程列表容器 */
        #days-container {
            padding: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="details-page">
    <header class="app-header">
        <div class="header-left">
            <button onclick="location.href='index.html'" class="btn-small">← 返回</button>
        </div>
        <div id="trip-title" class="trip-title">
            <span id="trip-title-text" class="trip-title-text">載入中...</span>
            <div id="trip-participants" class="trip-participants" aria-label="參與夥伴"></div>
        </div>
        
        <div class="actions">
            <button onclick="goToAlbum()" class="btn-small" style="background:#d2b48c; color:white; border:none;">🖼️</button>
            <button onclick="goToChat()" class="btn-small" style="background:#8a9a5b; color:white; border:none;">💬</button>
            <button onclick="goToLedger()" class="btn-small" style="background:var(--clay); color:white; border:none;">💰</button>
            <button id="edit-date-btn" onclick="editTripDates()" class="btn-small hidden">📅</button>
            <button id="delete-trip-btn" onclick="deleteTrip()" class="btn-small hidden" style="color:var(--danger); border-color:var(--danger);">🗑️</button>
        </div>
    </header>

    <div class="trip-layout">
        <!-- 地圖區域 -->
        <main class="map-view">
            <div id="map"></div>
        </main>

        <!-- 行程側邊欄 -->
        <aside class="itinerary-sidebar">
            <div class="search-box-container">
                <input id="pac-input" type="text" placeholder="🔍 搜尋地點或在地圖點擊...">
            </div>
            <div id="days-container">
                <!-- 由 JS 渲染 -->
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyByHmLJTyobrL2u8kjPmK-mDtD2JqR2Elc&libraries=places"></script>
    <script src="js/trip-details.js"></script>
    
    <script>
        function goToChat() {
            window.location.href = `trip-chat.html?id=${tripId}`;
        }
        
        function goToLedger() {
            window.location.href = `trip-ledger.html?id=${tripId}`;
        }
        
        function goToAlbum() {
            window.location.href = `trip-album.html?id=${tripId}`;
        }
    </script>
</body>
</html>
