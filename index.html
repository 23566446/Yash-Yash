<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f5f2ed">
    <title>YashYash | 行程公告欄</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="calendar.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-pending home-page" data-session-endpoint="/api/home-bootstrap">
    <header class="app-header">
        <div class="header-left">
            <button class="menu-btn" id="menu-open" aria-label="開啟選單" aria-controls="side-menu" aria-expanded="false">☰</button>
        </div>
        <h1 class="brand brand-center">YashYash</h1>
        <div class="header-right">
            <a id="notification-badge" href="user.html" class="hidden" aria-label="待處理通知">🔔 <span id="notification-count">0</span></a>
        </div>
    </header>

    <!-- 跑馬燈區塊 -->
    <div class="marquee-container">
        <div id="marquee-text" class="marquee-content">正在載入公告...</div>
    </div>

    <!-- 側邊選單 -->
    <div id="drawer-overlay" class="drawer-overlay" hidden></div>
    <nav id="side-menu" class="side-menu travel-drawer" aria-label="旅行選單" aria-hidden="true" inert>
        <div class="drawer-top">
            <span class="brand">YashYash</span>
            <button id="menu-close" class="drawer-close" type="button" aria-label="關閉選單" title="關閉選單">×</button>
        </div>
        <a class="drawer-profile" href="user.html">
            <img id="side-user-avatar" src="img/default-avatar.svg" alt="" width="52" height="52">
            <span class="drawer-profile-copy"><strong id="side-display-name">載入中...</strong><small id="side-account"></small></span>
            <span aria-hidden="true">›</span>
        </a>
        <p class="drawer-section">旅程</p>
        <ul class="menu-list">
            <li><a href="index.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg><span>首頁</span></a></li>
            <li><a href="create-trip.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>發起提案</span></a></li>
            <li><a href="past-trip.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/></svg><span>過去的行程</span></a></li>
        </ul>
        <p class="drawer-section">帳號</p>
        <ul class="menu-list">
            <li><a href="user.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>個人設定</span></a></li>
        </ul>
        <button id="menu-logout" class="drawer-logout" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5M9 12h12m-5-5 5 5-5 5"/></svg><span>登出此裝置</span></button>
    </nav>

    <main class="main-content">
        <!-- 即將到來的旅行 -->
        <section class="container">
            <p class="section-eyebrow">準備出發</p><h2 class="section-title">下一趟旅行</h2>
        </section>
        <div id="trip-list" class="board">
            <p class="empty-text">載入中...</p>
        </div>

        <!-- 行程公告欄 -->
        <section class="container">
            <p class="section-eyebrow">一起決定下一站</p><h2 class="section-title">旅行提案</h2>
        </section>
        <div id="announcement-board" class="board">
            <p class="empty-text">載入中...</p>
        </div>
    </main>

    <!-- 浮動新增按鈕 -->
    <button class="fab" onclick="location.href='create-trip.html'" aria-label="發起新提案"><span aria-hidden="true">＋</span><span class="fab-label">發起旅行</span></button>

    <script src="js/config.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/trip-order.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
