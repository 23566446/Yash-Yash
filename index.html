<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f5f2ed">
    <title>YashYash | 行程公告欄</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="calendar.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-pending home-page" data-session-endpoint="/api/home-bootstrap">
    <header class="app-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()" aria-label="開啟選單" aria-controls="side-menu" aria-expanded="false">☰</button>
        </div>
        <h1 class="brand brand-center">YashYash</h1>
        <div class="header-right">
            <a id="notification-badge" href="user.html" class="hidden" aria-label="待處理通知">🔔 <span id="notification-count">0</span></a>
        </div>
    </header>

    <!-- 跑馬燈區塊 -->
    <div class="marquee-container">
        <div id="marquee-text" class="marquee-content">正在載入公告...</div>
    </div>

    <!-- 側邊選單 -->
    <nav id="side-menu" class="side-menu" aria-label="主選單" aria-hidden="true">
        <div class="menu-header">
            <a class="menu-profile-card" href="user.html" aria-label="開啟個人設定">
                <img id="side-user-avatar" src="img/default-avatar.svg" class="nav-avatar" alt="用戶頭像">
                <span class="menu-profile-copy">
                    <span class="menu-profile-kicker">YashYash Traveller</span>
                    <strong id="side-display-name">載入中...</strong>
                    <span id="side-account" class="menu-profile-account"></span>
                </span>
            </a>
            <button class="close-btn" onclick="toggleMenu(false)" aria-label="關閉選單">×</button>
        </div>

        <div class="menu-scroll">
            <p class="menu-section-label">旅行</p>
            <ul class="menu-list">
                <li>
                    <a href="index.html" aria-current="page">
                        <span class="menu-icon" aria-hidden="true">⌂</span>
                        <span class="menu-item-copy"><strong>旅行總覽</strong><small>下一趟與旅行提案</small></span>
                    </a>
                </li>
                <li>
                    <a href="create-trip.html">
                        <span class="menu-icon" aria-hidden="true">＋</span>
                        <span class="menu-item-copy"><strong>發起新旅行</strong><small>先提出日期，一起決定</small></span>
                    </a>
                </li>
                <li>
                    <a href="past-trip.html">
                        <span class="menu-icon" aria-hidden="true">◷</span>
                        <span class="menu-item-copy"><strong>旅行回憶</strong><small>查看已完成的旅程</small></span>
                    </a>
                </li>
            </ul>

            <p class="menu-section-label">帳號</p>
            <ul class="menu-list">
                <li>
                    <a href="user.html">
                        <span class="menu-icon" aria-hidden="true">◎</span>
                        <span class="menu-item-copy"><strong>個人設定</strong><small>帳號、通知與登入安全</small></span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="menu-footer">
            <button id="menu-logout" type="button" class="menu-logout-button">
                <span class="menu-icon" aria-hidden="true">↪</span>
                <span class="menu-item-copy"><strong>登出此裝置</strong><small>保留其他裝置登入狀態</small></span>
            </button>
            <small class="menu-signature">YashYash · Travel together</small>
        </div>
    </nav>
    <button id="side-menu-backdrop" class="side-menu-backdrop" type="button" aria-label="關閉選單"></button>

    <main class="main-content">
        <!-- 即將到來的旅行 -->
        <section class="container">
            <p class="section-eyebrow">準備出發</p><h2 class="section-title">下一趟旅行</h2>
        </section>
        <div id="trip-list" class="board">
            <p class="empty-text">載入中...</p>
        </div>

        <!-- 行程公告欄 -->
        <section class="container">
            <p class="section-eyebrow">一起決定下一站</p><h2 class="section-title">旅行提案</h2>
        </section>
        <div id="announcement-board" class="board">
            <p class="empty-text">載入中...</p>
        </div>
    </main>

    <!-- 浮動新增按鈕 -->
    <button class="fab" onclick="location.href='create-trip.html'" aria-label="發起新提案"><span aria-hidden="true">＋</span><span class="fab-label">發起旅行</span></button>

    <script src="js/config.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/trip-order.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
