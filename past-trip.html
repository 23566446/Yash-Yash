<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YashYash | 回憶存檔</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* 過去行程專用的懷舊樣式 */
        .past-card {
            filter: grayscale(0.3);
            opacity: 0.9;
            border-left: 5px solid var(--clay) !important;
        }
        .past-card:hover {
            filter: grayscale(0);
            opacity: 1;
        }
        .archive-header {
            text-align: center;
            padding: 40px 20px;
            background: #ece9e4;
            margin-bottom: 30px;
        }
    </style>
</head>
<body class="auth-pending past-trips-page">
    <header class="app-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
        </div>
        <h1 class="brand brand-center">YashYash Archive</h1>
        <div class="header-right">
            <button onclick="location.href='index.html'" class="btn-small">返回</button>
        </div>
    </header>

    <!-- 側邊選單 (統一背景色) -->
    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <button class="close-btn" onclick="toggleMenu()">×</button>
            <div class="user-profile-side">
                <img id="side-user-avatar" src="img/default-avatar.svg" class="nav-avatar">
                <div id="side-display-name">載入中...</div>
            </div>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><span aria-hidden="true">🏠</span><span>首頁</span></a></li>
            <li><a href="user.html"><span aria-hidden="true">👤</span><span>個人設定</span></a></li>
            <li><a href="create-trip.html"><span aria-hidden="true">➕</span><span>發起提案</span></a></li>
            <li><a href="past-trip.html" aria-current="page"><span aria-hidden="true">📂</span><span>過去的行程</span></a></li>
            <li class="menu-divider"></li>
            <li class="menu-logout"><button id="menu-logout" type="button"><span aria-hidden="true">🚪</span><span>登出系統</span></button></li>
        </ul>
    </nav>

    <div class="archive-header">
        <h2 class="section-title" style="margin:0;">回憶存檔</h2>
        <p style="color:#888; font-style:italic;">那些曾與夥伴們共度的美好時光。</p>
    </div>

    <main class="main-content">
        <div id="past-trip-list" class="board">
            <p class="empty-text">正在載入回憶...</p>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/past-trip.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('active');
        }
        
    </script>
</body>
</html>
