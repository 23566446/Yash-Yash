<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YashYash | 發起提案</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <button onclick="location.href='index.html'" class="btn-small">← 返回</button>
        </div>
        <h2 style="margin:0;">發起新提案</h2>
        <div class="header-right"></div>
    </header>

    <main class="container">
        <div class="wabi-card">
            <h3>發起新的旅行提案</h3>
            <div class="form-group">
                <label>開始日期</label>
                <input type="date" id="start-date">
                
                <label>結束日期</label>
                <input type="date" id="end-date">
                
                <label>最低成行人數</label>
                <input type="number" id="min-ppl" value="2" min="1">
                
                <div class="actions" style="margin-top: 20px; display: flex; gap: 10px;">
                    <button onclick="location.href='index.html'" class="btn-text" style="flex: 1;">取消</button>
                    <button onclick="submitProposal()" class="btn-primary" style="flex: 2;">發布提案</button>
                </div>
            </div>
        </div>
    </main>

    <script>
    const API_URL = 'https://yash-yash.onrender.com';
    
    async function submitProposal() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;
        const minPpl = document.getElementById('min-ppl').value;
        
        if (!startDate || !endDate) {
            alert("🚨 請完整填寫開始與結束日期！");
            return;
        }

        if (new Date(endDate) < new Date(startDate)) {
            alert("🚨 結束日期不能早於開始日期喔！");
            return;
        }

        const user = JSON.parse(localStorage.getItem('yashyash_user'));
        
        const payload = {
            creator: user.nickname,
            start: startDate,
            end: endDate,
            min: parseInt(minPpl),
            votes: [user.account], 
            status: 'voting'
        };

        try {
            const response = await fetch(`${API_URL}/api/proposals`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(response.ok) {
                alert("✅ 提案已發布到公告欄！");
                location.href = 'index.html';
            } else {
                alert("發布失敗，請稍後再試");
            }
        } catch (err) {
            alert("伺服器連線失敗");
        }
    }
    </script>
</body>
</html>
