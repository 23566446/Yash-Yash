<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YashYash | 許可證管理</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <button onclick="location.href='user.html'" class="btn-small">← 返回後台</button>
        <h2 style="margin:0;">許可證金鑰管理</h2>
        <div style="width:50px;"></div>
    </header>

    <main class="container">
        <!-- 生成區塊 -->
        <section class="wabi-card">
            <h3>生成新許可證</h3>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="number" id="license-limit" value="1" min="1" style="margin:0; flex: 1; min-width: 100px;">
                <button onclick="createLicense()" class="btn-primary" style="white-space:nowrap; flex: 0 0 auto;">生成金鑰</button>
            </div>
            <p style="font-size:0.8rem; color:#888; margin-top:10px;">設定此金鑰可被多少人次用於註冊。</p>
        </section>

        <!-- 列表區塊 -->
        <section class="wabi-card">
            <h3>目前所有金鑰</h3>
            <div id="license-list">
                <p class="empty-text">載入中...</p>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/api.js"></script>
    <script>
        const API_URL = window.YashYashConfig.API_URL;

        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('yashyash_user') || 'null');
            if (!user || user.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            console.log("頁面載入，開始讀取許可證...");
            loadLicenses();
        };

        async function loadLicenses() {
            const list = document.getElementById('license-list');
            const showMessage = (message, color) => { const el = document.createElement('p'); el.className = 'empty-text'; if (color) el.style.color = color; el.textContent = message; list.replaceChildren(el); };
            showMessage('載入中...');
            
            try {
                console.log("正在請求:", `${API_URL}/api/admin/licenses`);
                const res = await apiFetch(`${API_URL}/api/admin/licenses`);
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }
                
                const data = await res.json();
                console.log("取得資料:", data);
                
                if (!Array.isArray(data) || data.length === 0) {
                    showMessage(Array.isArray(data) ? '目前沒有任何許可證金鑰' : '載入失敗');
                    return;
                }
                const rows = data.map(l => { const row=document.createElement('div'); row.className='user-item-row'; row.style.cssText='padding:15px 0; border-bottom:1px dashed #ddd;'; const info=document.createElement('div'); info.style.cssText='flex: 1; min-width: 0;'; const key=document.createElement('strong'); key.style.cssText='color:var(--accent-color); font-family:monospace; font-size:1.1rem; word-break: break-all;'; key.textContent=l.key; const usage=document.createElement('div'); usage.style.cssText='font-size:0.8rem; color:#666; margin-top: 5px;'; usage.textContent=`使用情況: ${l.used} / ${l.limit} `; const status=document.createElement('span'); status.style.cssText=`color:${l.used >= l.limit ? 'red' : 'green'}; font-weight:bold;`; status.textContent=l.used >= l.limit ? '(已失效)' : '(有效)'; usage.appendChild(status); const date=document.createElement('div'); date.style.cssText='font-size:0.7rem; color:#999; margin-top: 3px;'; date.textContent=`建立時間: ${new Date(l.createdAt).toLocaleString('zh-TW')}`; info.append(key,usage,date); const del=document.createElement('button'); del.className='btn-small'; del.style.cssText='color:red; border-color:#ffcccc; flex: 0 0 auto;'; del.textContent='刪除'; del.addEventListener('click',()=>deleteLicense(l._id)); row.append(info,del); return row; }); list.replaceChildren(...rows);
                
            } catch (e) {
                console.error("載入金鑰失敗:", e);
                const error = document.createElement('p'); error.className='empty-text'; error.style.color='var(--danger)'; error.textContent=`❌ 載入失敗：${e.message || '未知錯誤'}`; const hint=document.createElement('small'); hint.textContent='請確認後端伺服器是否正常運作'; error.append(document.createElement('br'), hint); list.replaceChildren(error);
            }
        }

        async function deleteLicense(id) {
            if(!confirm("⚠️ 確定要作廢並刪除此許可證金鑰嗎？\n刪除後，尚未使用的名額將無法再進行註冊。")) {
                return;
            }

            try {
                const res = await apiFetch(`${API_URL}/api/admin/licenses/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    alert("✅ 許可證已成功移除");
                    loadLicenses();
                } else {
                    const err = await res.json();
                    alert("❌ 刪除失敗：" + err.message);
                }
            } catch (e) {
                console.error(e);
                alert("❌ 網路連線失敗，請檢查後端是否啟動");
            }
        }

        async function createLicense() {
            const limitInput = document.getElementById('license-limit');
            const limitValue = parseInt(limitInput.value);

            if (!limitValue || limitValue < 1) {
                return alert("請輸入有效的使用次數（至少為 1）！");
            }

            try {
                const res = await apiFetch(`${API_URL}/api/admin/licenses`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ limit: limitValue })
                });
                
                if (res.ok) {
                    const newLicense = await res.json();
                    alert(`✨ 新許可證金鑰已生成！\n\n金鑰：${newLicense.key}\n次數：${newLicense.limit}`);
                    loadLicenses();
                    limitInput.value = 1; // 重置輸入框
                } else {
                    const err = await res.json();
                    alert("❌ 生成失敗：" + err.message);
                }
            } catch (e) {
                console.error(e);
                alert("❌ 伺服器連線失敗，請檢查網路");
            }
        }
    </script>
</body>
</html>
